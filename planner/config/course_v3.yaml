# gcopter_planner input for the real course: dronehacks-course-v3.step (Onshape, 20 x 20 ft
# floor, net cage 3.05 m high). Map: tools/cad_to_map.py dronehacks-course-v3.step
#   --out maps/course_v3.bin --scale 0.001 --up z --spacing 0.04   (CAD mm, z up, floor top z = 0)
# Mission below is a PROPOSAL read off the CAD, not an agreed course rule set:
#   launch mark -> maze gaps M1, M2, M3 -> through the oval tube -> C2a window -> landing pad.
# gcopter_planner input. Flat "Key: value" lines; '#' starts a comment;
# numbers separated by spaces or commas. Relative paths are relative to this
# file. Unknown keys are an error. Keys named like upstream
# gcopter/config/global_planning.yaml keep upstream's name and default value.
#

# ---- Map (map frame: metres, right-handed, z up) ----
MapFile:          ../maps/course_v3.bin
MapBound:         [-3.2, 3.2, -3.2, 3.2, 0.0, 3.2]   # cage +-3.049 m, roof 3.049 m; 64 x 64 x 32 voxels
VoxelWidth:       0.1                                 # finer than upstream: maze gaps are only 0.93 m
DilateRadius:     0.3                                 # 3 voxels; 0.93 m gap leaves ~0.33 m free

# ---- Mission (map frame) ----
StartPos:         [-2.5146, 0.9144, 0.0]   # centre of 'Launch mark'
StartHeadingDeg:  0.0               # ASSUMED: facing map +x (east, into the maze); set to the real launch heading
HoverHeight:      0.5               # the path starts at rest 0.5 m above the pad (the flight code takes off to it)
# Checkpoints (cx cy cz hx hy hz), in flight order. ASSUMED course order, read off the CAD:
Checkpoint:       [-1.9304, 2.5845, 1.0, 0.10, 0.12, 0.25]   # M1 maze gap (north end, y 2.121..3.048)
Checkpoint:       [-0.8128, 0.9715, 1.0, 0.10, 0.12, 0.25]   # M2 maze gap (south end, y 0.508..1.435)
Checkpoint:       [ 0.3048, 2.5845, 1.0, 0.10, 0.12, 0.25]   # M3 maze gap (north end)
Checkpoint:       [ 2.3114, 0.4572, 0.94, 0.25, 0.30, 0.25]  # inside the oval tube (inner 1.46 x 1.82 m, axis along y)
Checkpoint:       [-0.4710, -2.2715, 0.762, 0.08, 0.08, 0.12] # C2a window (0.914 m square, wall turned 20 deg)
Goal:             [-2.0422, -0.7925, 0.5]  # 0.5 m above the centre of 'Landing pad 5 ft', at rest; the flight code lands from here

# ---- Front end and corridor (literals in upstream global_planning.cpp) ----
TimeoutRRT:       0.5    # s per leg; upstream 0.01 cannot find the 0.2 m-wide (after dilation) maze gaps
CorridorProgress: 7.0    # convexCover progress (m)
CorridorRange:    3.0    # convexCover range (m)

# ---- GCOPTER limits and optimizer (upstream global_planning.yaml) ----
MaxVelMag:        4.0      # m/s
MaxBdrMag:        2.1      # rad/s, body rate magnitude
MaxTiltAngle:     1.05     # rad (60.2 deg)
MinThrust:        2.0      # N, see TODO below
MaxThrust:        12.0     # N, see TODO below
WeightT:          20.0
ChiVec:           [1.0e+4, 1.0e+4, 1.0e+4, 1.0e+4, 1.0e+5]   # penalty weights: pos vel omg theta thrust
SmoothingEps:     1.0e-2
IntegralIntervs:  16
RelCostTol:       1.0e-5

# ---- Vehicle physical parameters ----
# TODO(vehicle): PLACEHOLDERS. These are upstream's demo quadrotor, NOT our
# drone. Measure and replace before trusting any plan on hardware:
#   VehicleMass  total takeoff mass (kg), with battery and payload
#   Min/MaxThrust collective thrust range (N), e.g. from motor/prop thrust-stand data
#   HorizDrag, VertDrag, ParasDrag  drag coefficients of GCOPTER's flatness model
#   (flatness.hpp); 0 disables a term. Fit from flight logs or leave conservative.
VehicleMass:      0.61     # TODO(vehicle) kg
GravAcc:          9.8      # m/s^2
HorizDrag:        0.70     # TODO(vehicle)
VertDrag:         0.80     # TODO(vehicle)
ParasDrag:        0.01     # TODO(vehicle)
SpeedEps:         0.0001   # smoothing of |v| in the drag model (upstream)

# ---- Output (ours) ----
OutDir:           ../out/course_v3
SampleDt:         0.01     # s between rows of the path file
YawMinSpeed:      0.3      # m/s; below this horizontal speed, hold the last heading
YawRateMaxDeg:    90.0     # deg/s yaw-rate limit applied before smoothing
YawSmoothTime:    0.5      # s, width of the centered moving average on yaw (0 = off)
