# FROZEN profile "conservative" (night runs 2026-11-07): used by launch/conservative.launch.py.
# Do not tune this file; tune tracker.yaml / tracker_sim_x500.yaml and make a new profile instead.
# Lag tau_v 0.66 / t_delay 0.18 from the Gazebo fit (gt10) + kinsim; over-estimating the lag is benign.
mission_tracker:
  ros__parameters:
    control_rate_hz: 50.0
    speed_margin_mps: 0.1
    latency_comp_s: 0.06
    pose_timeout_s: 0.25
    use_px4_velocity: true
    clearance_slow_m: 0.0        # 0 = off
    clearance_stop_m: 0.0
    tracker.ff_mode: inverse
    tracker.tau_v: 0.66               # Gazebo fit (gt10); over-estimating is benign, under-estimating touched walls in kinsim
    tracker.t_delay: 0.18
    tracker.kc: 1.2
    tracker.ka: 0.6
    tracker.kz: 1.5
    tracker.ki: 0.0
    tracker.e0: 0.10
    tracker.e_span: 0.30
    tracker.e0_along: 0.10           # pinned: the profile must not follow later default changes
    tracker.e_span_along: 0.30
    tracker.taudot_max: 1.0
    tracker.taudot_acc: 1.0
    tracker.k_yaw: 1.5
    tracker.yaw_mode: path
    mission.takeoff_vz: 1.0          # PX4's 3 s takeoff ramp (MPC_TKO_RAMP_T) dominates anyway
    mission.settle_time: 0.3
    mission.course_start_dz: 0.15    # start the course this close to hover height
    mission.land_vz: 0.8
    mission.land_vz_slow: 0.3
    mission.land_slow_height: 0.25
